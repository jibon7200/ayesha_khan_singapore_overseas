{% extends "base.html" %}
{% block title %}ইউজার ফর্ম{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:700px;">
  <h5 class="mb-3">{% if object %}ইউজার সম্পাদনা{% else %}নতুন ইউজার তৈরি করুন{% endif %}</h5>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button type="submit" class="btn btn-primary">সংরক্ষণ করুন</button>
    <a href="{% url 'accounts:user_list' %}" class="btn btn-outline-secondary">বাতিল</a>
  </form>
</div>
{% endblock %}

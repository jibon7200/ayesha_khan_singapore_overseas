{% extends "base.html" %}
{% block title %}এজেন্ট ফর্ম{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:700px;">
  <h5 class="mb-3">{% if object %}এজেন্ট সম্পাদনা{% else %}নতুন এজেন্ট যোগ করুন{% endif %}</h5>
  <form method="post">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button type="submit" class="btn btn-primary">সংরক্ষণ করুন</button>
    <a href="{% url 'agents:list' %}" class="btn btn-outline-secondary">বাতিল</a>
  </form>
</div>
{% endblock %}
